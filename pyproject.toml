[project]
name = "sentiment-dashboard"
version = "0.1.0"
description = "Customer review sentiment classification with a data-quality pipeline and an interactive Streamlit dashboard"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "streamlit>=1.38",
    "plotly>=5.24",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
sentiment-pipeline = "sentiment.pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentiment"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["C408"]  # dict() calls are idiomatic in Plotly layout code
